# Nginx do ambiente local: a mesma ideia da VPS, sem HTTPS.
# O site sai da pasta site/ e tudo em /v1 vai para as duas réplicas da API, alternando entre elas.
upstream api {
    zone api 64k;
    server api:4310 max_fails=1 fail_timeout=30s;
    server api-2:4310 max_fails=1 fail_timeout=30s;
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    root /usr/share/nginx/html;
    location /v1/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Réplica parada: desiste em 2 s e tenta a outra, em vez de deixar o celular esperando.
        proxy_connect_timeout 2s;
        proxy_read_timeout 75s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
    location = /health { proxy_pass http://api; }
}
